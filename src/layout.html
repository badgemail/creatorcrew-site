<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
{{canonical}}
{{robots}}
<meta name="theme-color" content="#0B1F3A">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/montserrat-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{css_href}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">
      <img src="/img/crew-icon-header.webp" width="69" height="44" alt="">
      <span>Creator Crew</span>
    </a>
    <nav aria-label="Main">
      <ul class="nav">{{nav}}</ul>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>Creator Crew is the free companion update for <cite>{{bookTitle}}</cite> by {{author}}, published by {{publisher}}.</p>
    <p>Your details are never sold, rented or passed on. <a href="/privacy/">Privacy notice</a></p>
    <p class="small">© 2026 {{publisher}}</p>
  </div>
</footer>
</body>
</html>
